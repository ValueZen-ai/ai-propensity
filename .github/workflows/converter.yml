name: tests

# Optional, informational only: runs the tests on each push and pull
# request and reports pass/fail. It doesn't publish anything and nothing
# depends on it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      # Includes tests/test_converter_parity.py: the browser converter must
      # produce exactly what the Python adapters produce.
      - run: python -m pytest tests
      - run: node --test converter/test/*.test.mjs
      # converter/ai-propensity-converter.html must be a fresh build of converter/src.
      - run: node converter/build.mjs --check
